<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1726" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="hub-icon-180.png">
<title>Novidades · Meus apps</title>
<style>
:root{--bg:#F4F1F8;--surface:#FFFFFF;--ink:#241C35;--muted:#6C6283;--line:#E2DBEE;--accent:#7A5FBE;--accent-soft:#EEE8FA;--shadow:0 1px 2px rgba(36,28,53,.05),0 8px 22px rgba(36,28,53,.08);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1726;--surface:#252036;--ink:#F1ECFA;--muted:#A79CC2;--line:#3A3152;--accent:#B39BEA;--accent-soft:#33284C;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.voltar{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;font-size:15px;padding:6px 0}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:14px;line-height:1.45}
.abas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 6px;padding:2px 1px 4px}
.abas::-webkit-scrollbar{display:none}
.aba{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.aba span{color:var(--accent);margin-left:4px}
.aba[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.aba[aria-current="true"] span{color:#fff}
.dica{color:var(--muted);font-size:12.5px;text-align:center;margin:4px 0 0}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:10px}
.trilho::-webkit-scrollbar{display:none}
.painel{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 1px}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.painel-topo{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.painel-topo img{width:56px;height:56px;border-radius:14px;flex:none}
.painel-topo h2{font-size:19px;margin:0}
.painel-topo .atual{color:var(--muted);font-size:14px;margin-top:3px}
.painel-topo .atual strong{color:var(--accent)}
.bloco-versao{margin-top:16px}
.bloco-versao h3{font-size:15.5px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.bloco-versao ul{margin:0;padding-left:20px}
.bloco-versao li{font-size:14.5px;line-height:1.5;margin:6px 0;overflow-wrap:anywhere}
.bloco-versao + .bloco-versao{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.pontos{display:flex;justify-content:center;gap:8px;margin-top:16px}
.ponto{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .2s,background .2s}
.ponto.on{width:22px;background:var(--accent)}
.vazio{color:var(--muted);text-align:center;padding:32px 0}
.rodape{color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px;line-height:1.5}
</style>
</head>
<body>
<main>
  <a class="voltar" href="index.html">‹ Meus apps</a>
  <h1>Novidades</h1>
  <div class="sub">Veja a versão de cada app e o que mudou em cada atualização.</div>

  <nav class="abas" id="abas" aria-label="Escolha um app"></nav>
  <p class="dica">Arraste para o lado para ver o próximo app.</p>

  <div class="trilho" id="trilho" aria-live="polite"></div>
  <div class="pontos" id="pontos" aria-hidden="true"></div>

  <p class="rodape">Versões e novidades ficam guardadas junto com o próprio app.</p>
</main>
<script src="versoes.js"></script>
<script>
(function () {
  'use strict';

  const V = window.MEUS_APPS_VERSOES;
  const ORDEM = ['hub', 'patinhas', 'maison', 'listas'];
  const abas = document.getElementById('abas');
  const trilho = document.getElementById('trilho');
  const pontos = document.getElementById('pontos');

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function painel(app) {
    const blocos = (app.historico || []).map(function (v, i) {
      return '<section class="bloco-versao"><h3>Versão ' + esc(v.versao) +
        (i === 0 ? ' <span class="tag">atual</span>' : '') + '</h3><ul>' +
        (v.itens || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') +
        '</ul></section>';
    }).join('');
    return '<article class="painel" aria-label="Novidades de ' + esc(app.nome) + '"><div class="cartao">' +
      '<header class="painel-topo"><img src="' + esc(app.icone) + '" alt=""><div><h2>' + esc(app.nome) +
      '</h2><div class="atual">Versão atual: <strong>' + esc(app.atual) + '</strong></div></div></header>' +
      blocos + '</div></article>';
  }

  if (!V) {
    trilho.innerHTML = '<p class="vazio">Não foi possível carregar as novidades agora.</p>';
    return;
  }

  abas.innerHTML = ORDEM.map(function (k, i) {
    return '<button type="button" class="aba" data-i="' + i + '" aria-current="' + (i === 0 ? 'true' : 'false') + '">' +
      esc(V[k].nome) + '<span>v' + esc(V[k].atual) + '</span></button>';
  }).join('');
  trilho.innerHTML = ORDEM.map(function (k) { return painel(V[k]); }).join('');
  pontos.innerHTML = ORDEM.map(function () { return '<span class="ponto"></span>'; }).join('');

  function indiceAtual() {
    const largura = trilho.clientWidth || 1;
    return Math.min(ORDEM.length - 1, Math.max(0, Math.round(trilho.scrollLeft / largura)));
  }

  function marcar() {
    const i = indiceAtual();
    abas.querySelectorAll('.aba').forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    pontos.querySelectorAll('.ponto').forEach(function (p, j) { p.classList.toggle('on', j === i); });
    const botao = abas.querySelector('.aba[aria-current="true"]');
    if (botao && botao.scrollIntoView) botao.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  let quadro = 0;
  trilho.addEventListener('scroll', function () {
    cancelAnimationFrame(quadro);
    quadro = requestAnimationFrame(marcar);
  }, { passive: true });

  abas.addEventListener('click', function (e) {
    const b = e.target.closest('.aba');
    if (!b) return;
    trilho.scrollTo({ left: Number(b.dataset.i) * trilho.clientWidth, behavior: 'smooth' });
  });

  window.addEventListener('resize', function () {
    trilho.scrollTo({ left: indiceAtual() * trilho.clientWidth });
  });

  marcar();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
