<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patinhas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap">
<title>Patinhas em Dia</title>
<style>
:root{--bg:#F3F6F1;--surface:#FFFFFF;--surface-2:#E7EEE5;--ink:#17231E;--muted:#5B6B63;--line:#D9E2D9;--accent:#E0623A;--accent-ink:#FFFFFF;--accent-soft:#FCE9E1;--ok:#23704F;--ok-soft:#DCF0E4;--warn:#8F560A;--warn-soft:#FBEFD2;--bad:#B42318;--bad-soft:#FBE2DF;--shadow:0 1px 2px rgba(23,35,30,.06),0 6px 18px rgba(23,35,30,.07);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1714;--surface:#152420;--surface-2:#1C2E28;--ink:#E8F0EA;--muted:#9AAEA4;--line:#2A3E36;--accent:#F08A5D;--accent-ink:#1A1410;--accent-soft:#3A2820;--ok:#6BCB9A;--ok-soft:#1B3A2C;--warn:#E7B45A;--warn-soft:#3A2F16;--bad:#FF8A7A;--bad-soft:#3D221F;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1714;--surface:#152420;--surface-2:#1C2E28;--ink:#E8F0EA;--muted:#9AAEA4;--line:#2A3E36;--accent:#F08A5D;--accent-ink:#1A1410;--accent-soft:#3A2820;--ok:#6BCB9A;--ok-soft:#1B3A2C;--warn:#E7B45A;--warn-soft:#3A2F16;--bad:#FF8A7A;--bad-soft:#3D221F;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){body{max-width:560px;margin-inline:auto}}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:19px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:15px;background:var(--accent);display:grid;place-items:center}
.logo svg,.icone svg{width:26px;height:26px;fill:var(--accent-ink)}
.icone{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.icone svg{fill:var(--accent)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top-acoes{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.status{font-size:12px;color:var(--muted);white-space:nowrap}

.tabs{position:sticky;top:max(0px,env(safe-area-inset-top,0px));z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--muted);font:700 13px Figtree,system-ui,sans-serif;min-height:42px;border-radius:999px;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;min-width:0}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center}

button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button.pequeno{min-height:36px;padding:7px 14px;font-size:13px}
button.perigo{background:var(--bad-soft);color:var(--bad);border:1px solid transparent}
button.filtro{flex:none;min-height:36px;padding:7px 14px;font-size:13px;background:var(--surface);color:var(--muted);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
button.filtro[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.filtro i{width:10px;height:10px;border-radius:50%;background:var(--tom,var(--accent));display:inline-block}
button.iconbtn{min-height:40px;width:40px;padding:0;display:grid;place-items:center;font-size:20px;line-height:1;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;min-width:0}
.card h3{margin-bottom:8px}
.vazio{text-align:center;padding:26px 18px}
.vazio h2{font-size:20px;margin-bottom:6px}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-style:dashed;border-color:var(--accent)}
.aviso{display:grid;gap:10px;background:var(--warn-soft);border-radius:14px;padding:12px}
.aviso-seg{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.dica-ios{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-bottom:12px}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}

.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:4px}
.stat{border-radius:18px;padding:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font:800 28px/1 "Bricolage Grotesque",Figtree,sans-serif}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.25}
.stat.bad b{color:var(--bad)}
.stat.warn b{color:var(--warn)}
.stat.ok b{color:var(--ok)}

.faixa{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.faixa::-webkit-scrollbar{display:none}
.chip{flex:none;width:136px;min-height:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:12px;font-weight:400;text-align:left;box-shadow:var(--shadow)}
.chip strong{font:800 16px/1.1 "Bricolage Grotesque",Figtree,sans-serif}
.chip small{color:var(--muted);font-size:12px;line-height:1.3}

.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--tom,var(--accent));color:#fff;display:grid;place-items:center;font:800 18px "Bricolage Grotesque",Figtree,sans-serif}
.avatar.g{width:64px;height:64px;font-size:26px}

.linha{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.linha:first-child{border-top:0;padding-top:0}
.linha:last-child{padding-bottom:0}
.acoes-linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.neutro{background:var(--surface-2);color:var(--muted)}

.linha-gato{width:100%;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left;font-weight:400}
.linha-gato .info{display:grid;gap:2px;min-width:0}
.linha-gato .info strong{font:800 18px/1.15 "Bricolage Grotesque",Figtree,sans-serif}
.seta{font-size:24px;color:var(--muted)}

.remedio{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.remedio:first-child{border-top:0;padding-top:0}
.prog{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--tom,var(--accent));border-radius:999px}

.hero{display:flex;gap:14px;align-items:center;margin-bottom:14px;min-width:0}
.hero h2{font-size:26px}
.hero p{color:var(--muted);font-size:14px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voltar{margin-bottom:12px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-head h3{font-size:18px;text-align:center;flex:1}
.dias-sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:6px}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.grade>span{min-height:56px}
.dia{position:relative;min-width:0;min-height:56px;padding:5px 2px 7px;border-radius:12px;background:transparent;color:var(--ink);border:1px solid transparent;font:600 13px Figtree,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;cursor:pointer;overflow:hidden}
.dia.hoje{border-color:var(--accent)}
.dia.sel{background:var(--surface-2);border-color:var(--ink)}
.dia .pontos{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:7px}
.dia .pontos i{width:7px;height:7px;border-radius:50%;background:var(--tom,var(--accent));display:block}
.dia .pontos i.anel{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tom,var(--accent))}
.dia .barras{position:absolute;left:3px;right:3px;bottom:4px;display:grid;gap:2px}
.dia .barras i{display:block;height:4px;border-radius:3px;background:var(--tom,var(--accent))}
.dia em.mais{font-style:normal;font-size:10px;font-weight:700;line-height:1;color:var(--muted);align-self:center}
.grade.tudo .dia{min-height:64px;overflow:visible}
.grade.tudo .dia .pontos{min-height:0;flex-wrap:wrap;max-width:100%}
.grade.tudo .dia .barras{position:static;width:100%;display:grid;gap:2px;padding:0 3px;box-sizing:border-box}
.legenda{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin-top:12px;align-items:center}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:50%;background:var(--tom,var(--accent));display:inline-block}
.legenda i.barra{width:16px;height:5px;border-radius:3px}
.legenda i.anel{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}

.pilha{display:grid;gap:12px}
.dupla{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:360px){.dupla{grid-template-columns:minmax(0,1fr)}}
label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;width:100%;min-width:0;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
textarea{min-height:72px;resize:vertical}
.resumo-txt{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:220px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0;margin-bottom:8px}
.cores{display:flex;gap:12px;flex-wrap:wrap}
.cor{position:relative;display:inline-flex;cursor:pointer}
.cor input{position:absolute;opacity:0;width:1px;height:1px;margin:0;min-height:0}
.cor span{width:36px;height:36px;border-radius:50%;background:var(--tom);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.cor input:checked + span{outline:3px solid var(--ink);outline-offset:2px}
.cor input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.icones-gato{display:flex;flex-wrap:wrap;gap:12px}
.icone-op{position:relative;display:grid;justify-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--muted);min-width:64px}
.icone-op input{position:absolute;opacity:0;width:1px;height:1px;margin:0;min-height:0}
.icone-bola{width:52px;height:52px;border-radius:50%;background:var(--tom);color:#fff;display:grid;place-items:center;font:800 20px "Bricolage Grotesque",Figtree,sans-serif;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.icone-bola svg{width:62%;height:62%;fill:#fff}
.icone-op input:checked + .icone-bola{outline:3px solid var(--ink);outline-offset:2px}
.icone-op input:focus-visible + .icone-bola{outline:3px solid var(--accent);outline-offset:2px}
.icone-op input:checked ~ small{color:var(--ink);font-weight:700}
.avatar svg{width:62%;height:62%;fill:#fff}
.avatar svg .olho,.icone-bola svg .olho{fill:var(--tom,var(--accent))}
.avatar.com-foto{overflow:hidden;padding:0}
.avatar img,.icone-bola img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.foto-escolher-linha{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:12px}
.foto-escolher-linha .small{margin:0}
.foto-escolher{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.foto-escolher input{position:absolute;opacity:0;width:1px;height:1px;margin:0;min-height:0}
.foto-escolher:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.chips-banco{display:flex;flex-wrap:wrap;gap:8px}
.chips-banco span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.chips-banco button{min-height:28px;width:28px;padding:0;background:transparent;color:var(--muted);font-size:16px}

.grafico{width:100%;height:auto;display:block}
.grafico text{font:600 11px Figtree,system-ui,sans-serif;fill:var(--muted)}

.olho{fill:var(--accent)}
.logo .olho{fill:var(--accent)}
.icone .olho{fill:var(--accent-soft)}
.dose{width:100%;min-height:54px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px;text-align:left;font-weight:400;box-shadow:var(--shadow);--tom:var(--accent)}
.dose .hora{font:800 18px/1 "Bricolage Grotesque",Figtree,sans-serif;color:var(--tom)}
.dose .dose-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dose .marca{width:28px;height:28px;border-radius:50%;border:2px solid var(--tom);display:grid;place-items:center;font-weight:800;font-size:15px;color:transparent}
.dose.feita{background:var(--ok-soft)}
.dose.feita .marca{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.dose.feita .dose-txt{text-decoration:line-through;color:var(--muted)}
.aviso-dose{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dose.previsto{cursor:default;opacity:.85}
.rodape{text-align:center;font-size:12px;color:var(--muted);margin:28px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:20;text-align:center}
.dose.atrasada{background:var(--bad-soft);border-color:var(--bad)}
.dose.atrasada .hora{color:var(--bad)}
.dose.atrasada .marca{border-color:var(--bad)}
.dose .estado{display:block;font-size:12px;font-weight:700;color:var(--muted);white-space:normal}
.dose.atrasada .estado{color:var(--bad)}
.dose.feita .estado{color:var(--ok)}
.sugestoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugestao{min-height:34px;padding:6px 12px;font-size:13px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.campo-horarios{border:0;padding:0;margin:0;min-width:0}
.campo-horarios legend{font-size:13px;font-weight:700;color:var(--muted);padding:0;margin-bottom:8px}
.rd-wrap{display:flex;align-items:center;justify-content:center;gap:12px}
.rd-box{position:relative;width:min(120px,calc((100vw - 140px) / 2));height:178px;overflow:hidden;border-radius:18px;background:var(--surface-2);border:1px solid var(--line)}
.rd-rolo{height:176px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:66px 0;overscroll-behavior:contain}
.rd-rolo::-webkit-scrollbar{display:none}
.rd-item{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font:800 26px "Bricolage Grotesque",Figtree,sans-serif;color:var(--muted);cursor:pointer;user-select:none}
.rd-item.sel{color:var(--ink)}
.rd-foco{position:absolute;left:0;right:0;top:66px;height:44px;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);pointer-events:none}
.rd-sep{font:800 28px/1 "Bricolage Grotesque",Figtree,sans-serif;color:var(--muted)}
.rd-display{font:800 30px/1 "Bricolage Grotesque",Figtree,sans-serif;color:var(--ink)}
.alerta-ontem{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--warn-soft);border-color:var(--warn)}
main > section:not([hidden]){animation:entrar .35s ease-out both}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{transition:transform .15s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease}
button:active{transform:scale(.97)}
.tab{transition:background-color .25s ease,color .25s ease,box-shadow .25s ease}
.dose{transition:background-color .25s ease,border-color .25s ease,transform .15s ease}
.dose:active{transform:scale(.985)}
.dose .marca{transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.dose.pop .marca{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.dia{transition:background-color .2s ease,border-color .2s ease}
.chips-banco span{animation:entrar .25s ease-out both}
.rd-item{transition:transform .18s ease,opacity .18s ease}
.toast:not([hidden]){animation:toast .3s ease-out both}
.atualizar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,0px));background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.atualizar span{flex:1;min-width:0}
.atualizar button{min-height:36px;padding:7px 14px;font-size:13px;background:var(--surface);color:var(--ink)}
.atualizar button.fechar{background:transparent;color:var(--accent-ink);min-height:36px;padding:4px 10px;font-size:20px;line-height:1}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" id="logo" aria-hidden="true"></div>
    <div style="min-width:0">
      <p class="kicker">Saúde felina</p>
      <h1>Patinhas em Dia</h1>
    </div>
  </div>
  <div class="top-acoes">
    <span class="status" id="status"></span>

<script>
const $ = (s) => document.querySelector(s);

const LS = 'patinhas-em-dia-v1';

const NOMES_TOM = ['Laranja','Verde','Azul','Roxo','Mostarda','Rosa'];
const ICONES_GATO = {

const BANCO_PADRAO = ['Praziquantel','Pirantel','Fembendazol','Ivermectina','Milbemicina','Fipronil','Imidacloprida','Selamectina','Sarolaner','Afoxolaner','Fluralaner','Amoxicilina','Amoxicilina com clavulanato','Cefalexina','Doxiciclina','Enrofloxacino','Marbofloxacino','Metronidazol','Clindamicina','Azitromicina','Meloxicam','Prednisolona','Dexametasona','Buprenorfina','Tramadol','Gabapentina','Maropitanto','Omeprazol','Ondansetrona','Metoclopramida','Sucralfato','Probióticos','Furosemida','Enalapril','Benazepril','Levotiroxina','Metimazol','Mirtazapina','Fenobarbital','Insulina','Taurina (suplemento)','Ômega 3 (suplemento)','Colírio','Pomada','Gotas para ouvido'];
const DICAS = [
  'Gatos costumam esconder dor. Comer menos ou se isolar por alguns dias merece uma conversa com o veterinário.',
  'Pese o gato no mesmo horário, uma vez por semana. Peso estável é um dos sinais mais simples de saúde.',

const ICONE_PATA = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12.00" cy="13.92" rx="7.92" ry="6.72"/><polygon points="4.80,12.48 5.04,4.08 10.80,8.64"/><polygon points="19.20,12.48 18.96,4.08 13.20,8.64"/><circle class="olho" cx="9.60" cy="13.20" r="0.96"/><circle class="olho" cx="14.40" cy="13.20" r="0.96"/><polygon class="olho" points="12.00,15.48 11.09,14.52 12.91,14.52"/></svg>';

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function iso(d){ return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); }
const hoje = () => iso(new Date());
const somaDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return iso(x); };
const dias = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
const fmtData = (s) => s ? s.split('-').reverse().join('/') : '';
const kg = (v) => Number(v).toFixed(1).replace('.', ',');
const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function idade(nasc){
  if (!nasc) return 'idade não informada';

  if (m < 0) return 'idade não informada';
  if (m < 1) return 'menos de 1 mês';

}

let pickH = 8, pickM = 0, horariosForm = [];

let view = 'hoje', catId = null, editando = false, resumoAberto = false, prefill = null;
let histFiltro = 'todos', importacao = null, armado = null, armTimer = null;
let calMes = hoje().slice(0, 7), calDia = hoje(), calFiltro = 'todos';
let calCatMes = hoje().slice(0, 7), calCatDia = hoje();
let calTudo = false;
try { calTudo = localStorage.getItem('patinhas-cal-tudo') === '1'; } catch (_) {}

function norm(x){
  if (!x || !Array.isArray(x.cats)) return {cats: [], bancoExtra: []};
  return {
    demo: !!x.demo,
    bancoExtra: Array.isArray(x.bancoExtra) ? x.bancoExtra.filter(s => typeof s === 'string' && s.trim()).slice(0, 200) : [],
    cats: x.cats.map((c, i) => ({
      id: String(c.id || uid()),
      nome: String(c.nome || 'Sem nome').slice(0, 40),
      nasc: c.nasc || '',
      cor: c.cor || '',
      icone: c.icone === 'foto' ? (fotoValida(c.foto) ? 'foto' : 'inicial') : (iconeValido(c.icone) ? c.icone : 'inicial'),
      foto: fotoValida(c.foto) ? c.foto : '',
      tom: Number.isInteger(c.tom) ? c.tom % TONS.length : i % TONS.length,
      eventos: Array.isArray(c.eventos) ? c.eventos.filter(e => e && e.tipo && e.data).map(e => ({
        id: String(e.id || uid()),
        tipo: e.tipo,
        data: e.data,
        valor: e.valor == null ? null : Number(e.valor),
        proxima: e.proxima || '',
        nota: e.nota || ''
      })) : [],
      remedios: Array.isArray(c.remedios) ? c.remedios.filter(r => r && r.nome && r.inicio).map(r => ({
        id: String(r.id || uid()),
        nome: String(r.nome).slice(0, 60),
        inicio: r.inicio,
        dias: Math.max(0, Math.min(3650, Number(r.dias) || 0)),
        obs: String(r.obs || '').slice(0, 120),
        horarios: Array.isArray(r.horarios) ? r.horarios.filter(h => typeof h === 'string' && /^\d{2}:\d{2}$/.test(h)).slice(0, 12) : [],
        feitos: limpaFeitos(r.feitos)
      })) : []
    }))
  };
}
function carregar(){
  try { return norm(JSON.parse(localStorage.getItem(LS) || 'null')); } catch (_) { return {cats: [], bancoExtra: []}; }
}
function salvar(msg){

function setStatus(t){ $('#status').textContent = t; }
function toast(texto){

function confirmar(chave, fn){
  if (armado !== chave) {
    armado = chave; clearTimeout(armTimer);

}
const atual = () => state.cats.find(c => c.id === catId);
const pesos = (c) => c.eventos.filter(e => e.tipo === 'peso' && e.valor != null).sort((a, b) => a.data.localeCompare(b.data));
const ultimoPeso = (c) => { const p = pesos(c); return p[p.length - 1]; };
function lembretes(){
  const r = [], h = hoje();
  state.cats.forEach(c => c.eventos.forEach(e => {
    if (e.proxima) r.push({c, e, d: dias(e.proxima, h), data: e.proxima, agendado: false});
    else if (INTERVALO[e.tipo] && e.data > h) r.push({c, e, d: dias(e.data, h), data: e.data, agendado: true});
  }));
  return r.sort((a, b) => a.data.localeCompare(b.data));
}
function avatar(c, grande){
  const cls = `avatar${grande ? ' g' : ''}`;
  if (c.icone === 'foto' && fotoValida(c.foto)) return `<span class="${cls} com-foto" style="--tom:${TONS[c.tom]}" aria-hidden="true"><img src="${c.foto}" alt=""></span>`;
  if (c.icone && c.icone !== 'inicial' && iconeValido(c.icone)) return `<span class="${cls}" style="--tom:${TONS[c.tom]}" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false">${ICONES_GATO[c.icone]}</svg></span>`;
  return `<span class="${cls}" style="--tom:${TONS[c.tom]}" aria-hidden="true">${esc(c.nome.charAt(0).toUpperCase())}</span>`;
}

// ---------- remédios ----------
const fimRemedio = (r) => r.dias ? somaDias(r.inicio, r.dias - 1) : '';
const remedioNoDia = (r, d) => r.inicio <= d && (!r.dias || d <= fimRemedio(r));
function statusRemedio(r, ref){
  ref = ref || hoje();
  if (r.inicio > ref) return `Começa em ${plural(dias(r.inicio, ref), 'dia', 'dias')} (${fmtData(r.inicio)})`;
  const usado = dias(ref, r.inicio) + 1;
  if (!r.dias) return `Uso contínuo · ${plural(usado, 'dia', 'dias')} de uso`;
  const fim = fimRemedio(r);
  if (ref > fim) return `Terminou em ${fmtData(fim)} · ${plural(r.dias, 'dia', 'dias')} de tratamento`;
  const restam = dias(fim, ref);
  return `Dia ${usado} de ${r.dias} · ${restam === 0 ? 'último dia' : 'faltam ' + plural(restam, 'dia', 'dias')}`;
}
function progresso(r, ref){
  if (!r.dias) return null;
  const usado = dias(ref || hoje(), r.inicio) + 1;
  return Math.max(0, Math.min(100, Math.round(usado / r.dias * 100)));
}
function limpaFeitos(f){
  const out = {};
  if (!f || typeof f !== 'object' || Array.isArray(f)) return out;
  Object.keys(f).forEach(d => {
    if (/^\d{4}-\d{2}-\d{2}$/.test(d) && Array.isArray(f[d])) {
      const hs = f[d].filter(h => typeof h === 'string' && /^\d{2}:\d{2}$/.test(h));
      if (hs.length) out[d] = hs;
    }
  });
  return out;
}
function parseHorarios(txt){
  const partes = String(txt || '').split(/[,;\s]+/).filter(Boolean);
  if (!partes.length) return {ok: true, lista: []};
  const lista = [];
  for (const p of partes) {
    const m = p.match(/^(\d{1,2})(?::(\d{2}))?$/);
    if (!m) return {ok: false, lista: []};
    const hh = Number(m[1]), mm = m[2] === undefined ? 0 : Number(m[2]);
    if (hh > 23 || mm > 59) return {ok: false, lista: []};
    const hora = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    if (!lista.includes(hora)) lista.push(hora);
  }
  return {ok: true, lista: lista.sort().slice(0, 12)};
}
function doseFeita(r, d, h){ return !!(r.feitos && r.feitos[d] && r.feitos[d].includes(h)); }
function alternarDose(r, d, h){
  r.feitos = r.feitos || {};
  const lista = r.feitos[d] || [];
  const nova = lista.includes(h) ? lista.filter(x => x !== h) : [...lista, h].sort();
  if (nova.length) r.feitos[d] = nova; else delete r.feitos[d];
}
function todosRemedios(){ return state.cats.length ? state.cats.flatMap(c => c.remedios.map(r => ({c, r}))) : []; }
function bancoLista(){
  const set = new Map();
  [...BANCO_PADRAO, ...state.bancoExtra].forEach(n => { const k = n.toLowerCase(); if (!set.has(k)) set.set(k, n); });
  return [...set.values()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

// ---------- calendário ----------
function gradeMes(mes){
  const [y, m] = mes.split('-').map(Number);
  const offset = new Date(y, m - 1, 1).getDay();
  const total = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(`${mes}-${String(d).padStart(2, '0')}`);
  while (cells.length % 7) cells.push(null);
  return cells;
}
function somaMes(mes, n){
  const [y, m] = mes.split('-').map(Number);
  return iso(new Date(y, m - 1 + n, 1)).slice(0, 7);
}
function tituloMes(mes){
  const [y, m] = mes.split('-').map(Number);
  return cap(new Date(y, m - 1, 1).toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}));
}
function eventosDoDia(d, cats){
  const out = [], h = hoje();
  cats.forEach(c => c.eventos.forEach(e => {
    const agendado = !!INTERVALO[e.tipo] && e.data > h;
    if (e.data === d) out.push({c, e, ret: agendado, agendado});
    if (e.proxima === d) out.push({c, e, ret: true, agendado: false});
  }));
  return out;
}
function remediosNoDia(d, cats){
  const out = [];
  cats.forEach(c => c.remedios.forEach(r => { if (remedioNoDia(r, d)) out.push({c, r}); }));
  return out;
}
function renderCalendario(escopo, mes, dia, cats, porTipo){
  const h = hoje();
  const celulas = gradeMes(mes).map(d => {
    if (!d) return '<span></span>';
    const evs = eventosDoDia(d, cats), meds = remediosNoDia(d, cats);
    const cortaEv = !calTudo && evs.length > 4, cortaMed = !calTudo && meds.length > 3;
    const pontos = (cortaEv ? evs.slice(0, 4) : evs).map(({c, e, ret}) => `<i class="${ret ? 'anel' : ''}" style="--tom:${porTipo ? TIPO_COR[e.tipo] : TONS[c.tom]}"></i>`).join('') + (cortaEv ? `<em class="mais">+${evs.length - 4}</em>` : '');
    const barras = (cortaMed ? meds.slice(0, 3) : meds).map(({c}) => `<i style="--tom:${TONS[c.tom]}"></i>`).join('') + (cortaMed ? `<em class="mais">+${meds.length - 3}</em>` : '');
    return `<button type="button" class="dia${d === h ? ' hoje' : ''}${d === dia ? ' sel' : ''}" data-act="cal-dia" data-cal="${escopo}" data-d="${d}" aria-label="${fmtData(d)}">
      <span>${Number(d.slice(8))}</span><span class="pontos">${pontos}</span><span class="barras">${barras}</span></button>`;
  }).join('');
  return `<div class="cal-head">
      <button type="button" class="iconbtn" data-act="cal-mes" data-cal="${escopo}" data-delta="-1" aria-label="Mês anterior">‹</button>
      <h3>${esc(tituloMes(mes))}</h3>
      <button type="button" class="iconbtn" data-act="cal-mes" data-cal="${escopo}" data-delta="1" aria-label="Próximo mês">›</button>
    </div>
    <div class="dias-sem" aria-hidden="true"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    <div class="grade${calTudo ? ' tudo' : ''}">${celulas}</div>`;
}
function painelDia(d, cats, alvos){
  const evs = eventosDoDia(d, cats), meds = remediosNoDia(d, cats);
  const titulo = cap(new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'}));
  let h = `<div class="card pilha"><h3>${esc(titulo)}</h3>`;
  if (!evs.length && !meds.length) h += `<p class="muted">Nada marcado neste dia.</p>`;
  h += evs.map(({c, e, ret, agendado}) => `<div class="linha"><div style="min-width:0"><strong>${esc(TIPOS[e.tipo])} · ${esc(c.nome)}</strong><div class="muted small">${agendado ? 'Agendado' : ret ? 'Retorno previsto' : 'Registrado'}${e.nota ? ' · ' + esc(e.nota) : ''}</div></div></div>`).join('');
  const doses = meds.filter(({r}) => r.horarios && r.horarios.length).flatMap(({c, r}) => r.horarios.map(hr => ({c, r, hr})));
  doses.sort((a, b) => a.hr.localeCompare(b.hr) || a.c.nome.localeCompare(b.c.nome, 'pt-BR'));
  h += doses.map(({c, r, hr}) => doseHTML(c, r, hr, d)).join('');
  h += meds.filter(({r}) => !(r.horarios && r.horarios.length)).map(({c, r}) => `<div class="linha"><div style="min-width:0"><strong>${esc(r.nome)} · ${esc(c.nome)}</strong><div class="muted small">${esc(statusRemedio(r, d))}</div></div></div>`).join('');
  if (alvos.length) {
    h += `<div class="acoes">` + alvos.slice(0, 4).map(c => `<button type="button" class="ghost pequeno" data-act="dia-nova" data-id="${esc(c.id)}" data-d="${d}">Registrar · ${esc(c.nome)}</button><button type="button" class="ghost pequeno" data-act="rem-nova" data-id="${esc(c.id)}" data-d="${d}">Remédio · ${esc(c.nome)}</button>`).join('') + `</div>`;
  }
  return h + `</div>`;
}
function renderCalendarioTab(){
  const cats = calFiltro === 'todos' ? state.cats : state.cats.filter(c => c.id === calFiltro);
  if (!state.cats.length) {
    $('#calendario').innerHTML = `<div class="sec"><h2>Calendário</h2></div><div class="card vazio"><div class="icone">${ICONE_PATA}</div><h2>Nada para mostrar ainda</h2><p class="muted">Cadastre um gato para ver as datas de vacinas, consultas e remédios no calendário.</p><div class="acoes" style="justify-content:center;margin-top:14px"><button type="button" data-tab="gatos">Cadastrar gato</button></div></div>`;
    return;
  }
  let h = `<div class="sec"><h2>Calendário</h2><div class="acoes"><button type="button" class="ghost pequeno" aria-pressed="${calTudo}" data-act="cal-modo">${calTudo ? 'Resumir' : 'Ver tudo'}</button><button type="button" class="ghost pequeno" data-act="cal-hoje">Hoje</button></div></div>`;
  h += `<div class="filtros">${[['todos', 'Todos'], ...state.cats.map(c => [c.id, c.nome])].map(([k, v]) => {
    const c = state.cats.find(x => x.id === k);

// ---------- telas ----------
const pad2 = (n) => String(n).padStart(2, '0');
const agoraHM = () => { const x = new Date(); return pad2(x.getHours()) + ':' + pad2(x.getMinutes()); };
const ITEM_RODA = 44;
function dosesAtrasadasHoje(){
  const t = hoje(), ag = agoraHM();
  return todosRemedios().reduce((n, {r}) => n + (remedioNoDia(r, t) ? (r.horarios || []).filter(hr => hr < ag && !doseFeita(r, t, hr)).length : 0), 0);
}
function rdItens(n){ return Array.from({length: n}, (_, i) => `<div class="rd-item" data-v="${i}">${pad2(i)}</div>`).join(''); }
function rdChips(){
  return horariosForm.length
    ? horariosForm.map(x => `<span>${x}<button type="button" data-act="del-horario" data-h="${x}" aria-label="Remover ${x}">×</button></span>`).join('')
    : '<span class="muted small" style="background:none;padding:0">Toque em "+ Adicionar horário" para pôr mais de um. Sem adicionar nenhum, vale o horário que aparece no relógio.</span>';
}
function atualizarChips(){ const box = $('#chips-horarios'); if (box) box.innerHTML = rdChips(); }
function ajustarRodas(){
  requestAnimationFrame(() => {
    const rh = document.querySelector('.rd-rolo[data-rd="h"]'), rm = document.querySelector('.rd-rolo[data-rd="m"]');
    if (rh) { rh.scrollTop = pickH * ITEM_RODA; estiloRoda(rh, pickH); }
    if (rm) { rm.scrollTop = pickM * ITEM_RODA; estiloRoda(rm, pickM); }
  });
}
let animar = null;
function doseHTML(c, r, hr, d){
  const feita = doseFeita(r, d, hr);
  const hj = hoje();
  if (d > hj) {
    return `<div class="dose previsto" style="--tom:${TONS[c.tom]}"><span class="hora">${hr}</span><span class="dose-txt"><strong>${esc(r.nome)}</strong> · ${esc(c.nome)}<span class="estado">Previsto · ${fmtData(d)}</span></span><span class="marca" aria-hidden="true"></span></div>`;
  }
  const atrasada = !feita && (d < hj || (d === hj && hr < agoraHM()));
  const estado = feita ? 'Tomado' : d < hj ? 'Não marcado · toque para marcar' : atrasada ? 'Atrasado · toque para marcar' : 'Previsto';
  const pop = animar === r.id + '|' + hr + '|' + d ? ' pop' : '';
  return `<button type="button" class="dose${feita ? ' feita' : ''}${atrasada ? ' atrasada' : ''}${pop}" style="--tom:${TONS[c.tom]}" data-act="dose" data-id="${esc(c.id)}" data-rid="${esc(r.id)}" data-h="${hr}" data-d="${d}" aria-pressed="${feita}"><span class="hora">${hr}</span><span class="dose-txt"><strong>${esc(r.nome)}</strong> · ${esc(c.nome)}<span class="estado">${estado}</span></span><span class="marca" aria-hidden="true">✓</span></button>`;
}
function dosesOntemSemMarcar(){
  const o = somaDias(hoje(), -1), lista = [];
  todosRemedios().forEach(({c, r}) => {
    if (remedioNoDia(r, o)) (r.horarios || []).forEach(hr => { if (!doseFeita(r, o, hr)) lista.push({c, r, hr}); });
  });
  return lista;
}
function estiloRoda(rolo, idx){
  rolo.querySelectorAll('.rd-item').forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.classList.toggle('sel', d === 0);
    el.style.opacity = d === 0 ? '1' : d === 1 ? '.55' : '.25';
    el.style.transform = d === 0 ? 'scale(1.12)' : d === 1 ? 'scale(.92)' : 'scale(.82)';
  });
}

// Lê a foto escolhida, recorta no centro em quadrado de 256 px e devolve JPEG em data URL (cabe no armazenamento do app).
function lerFoto(arquivo){
  return new Promise((ok, falha) => {
    if (!arquivo || !/^image\//.test(arquivo.type)) { falha(new Error('tipo')); return; }
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - lado) / 2, sy = (img.naturalHeight - lado) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      canvas.getContext('2d').drawImage(img, sx, sy, lado, lado, 0, 0, 256, 256);
      URL.revokeObjectURL(url);
      ok(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem')); };
    img.src = url;
  });
}

function grafico(p){
  if (p.length < 2) return `<p class="muted">${p.length ? 'Registre mais um peso para ver a evolução.' : 'Registre o peso para acompanhar a evolução.'}</p>`;
  const W = 320, H = 160, L = 38, R = 14, T = 16, B = 28;
  const t0 = Date.parse(p[0].data + 'T12:00:00');
  const t1 = Date.parse(p[p.length - 1].data + 'T12:00:00');
  const span = Math.max(t1 - t0, 864e5);
  const vs = p.map(e => e.valor);
  let vmin = Math.min(...vs), vmax = Math.max(...vs);
  if (vmax - vmin < 0.4) { vmin -= 0.2; vmax += 0.2; } else { vmin -= 0.1; vmax += 0.1; }
  const X = (d) => L + ((Date.parse(d + 'T12:00:00') - t0) / span) * (W - L - R);
  const Y = (v) => T + (1 - (v - vmin) / (vmax - vmin)) * (H - T - B);
  const pts = p.map(e => [X(e.data), Y(e.valor)]);
  const path = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const grade = [vmax, (vmax + vmin) / 2, vmin].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/><text x="2" y="${(Y(v) + 4).toFixed(1)}">${kg(v)}</text>`).join('');
  const bolinhas = pts.map(q => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>`).join('');
  const ult = pts[pts.length - 1];
  const rotulo = `<text x="${ult[0].toFixed(1)}" y="${(ult[1] - 10).toFixed(1)}" text-anchor="end" style="fill:var(--ink)">${kg(p[p.length - 1].valor)} kg</text>`;
  const datas = `<text x="${L}" y="${H - 6}">${fmtData(p[0].data)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtData(p[p.length - 1].data)}</text>`;
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">${grade}<path d="${path}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${bolinhas}${rotulo}${datas}</svg>`;
}

      <div class="chips-banco" id="chips-horarios" style="margin-top:10px">${rdChips()}</div>
    </fieldset>
    <label>Observação (dose)<input name="obs" maxlength="120" placeholder="Ex.: 1 comprimido à noite"></label>
    <p class="aviso-seg">Dipirona, paracetamol e ibuprofeno são perigosos para gatos. Confirme dose e duração com o veterinário.</p>
    <button type="submit">Adicionar remédio</button>
  </form>`;
}

function renderFicha(){
  const c = atual();
  if (!c) return;
  const p = pesos(c), ult = p[p.length - 1];
  const ev = [...c.eventos].sort((a, b) => b.data.localeCompare(a.data));
  const rem = [...c.remedios].sort((a, b) => b.inicio.localeCompare(a.inicio));
  let h = `<button type="button" class="ghost pequeno voltar" data-act="voltar">← Gatos</button>`;
  h += `<div class="card">
    <div class="hero">${avatar(c, true)}<div style="min-width:0"><h2>${esc(c.nome)}</h2><p>${esc(idade(c.nasc))}${c.cor ? ' · ' + esc(c.cor) : ''}</p><p>${ult ? kg(ult.valor) + ' kg em ' + fmtData(ult.data) : 'Sem peso registrado'}</p></div></div>
    <div class="acoes">
      <button type="button" class="ghost pequeno" data-act="editar">${editando ? 'Fechar edição' : 'Editar'}</button>
      <button type="button" class="ghost pequeno" data-act="resumo">${resumoAberto ? 'Fechar resumo' : 'Resumo para a veterinária'}</button>
      <button type="button" class="ghost pequeno" data-act="compartilhar">Compartilhar</button>
    </div></div>`;
  if (editando) h += `<form id="form-editar" class="card pilha"><h3>Editar gato</h3>${camposGato(c)}<div class="acoes"><button type="submit">Salvar</button><button type="button" class="ghost" data-act="cancelar-edicao">Cancelar</button></div></form>`;
  if (resumoAberto) h += `<div class="card pilha"><p class="muted small">Copie ou compartilhe com a veterinária.</p><textarea class="resumo-txt" readonly id="resumo-txt">${esc(resumoTexto(c))}</textarea><div class="acoes"><button type="button" data-act="copiar-resumo">Copiar texto</button></div></div>`;

  h += `<div class="sec"><h2>Calendário</h2></div><div class="card">${renderCalendario('cat', calCatMes, calCatDia, [c], true)}
    <div class="legenda"><span><i class="anel"></i>Próxima data</span><span><i class="barra" style="--tom:${TONS[c.tom]}"></i>Remédio em uso</span></div></div>`;
  h += painelDia(calCatDia, [c], [c]);

  h += `<div class="sec"><h2>Remédios</h2></div>`;
  h += `<div class="card">` + (rem.length ? rem.map(r => {
    const pr = progresso(r, hoje());
    return `<div class="remedio" style="--tom:${TONS[c.tom]}"><div style="min-width:0"><strong>${esc(r.nome)}</strong>
      <div class="muted small">${fmtData(r.inicio)}${r.dias ? ' · ' + plural(r.dias, 'dia', 'dias') : ' · contínuo'}</div>
      <div class="small">${esc(statusRemedio(r, hoje()))}</div>${r.horarios && r.horarios.length ? '<div class="muted small">Horários: ' + esc(r.horarios.join(' · ')) + '</div>' : ''}${r.obs ? `<div class="muted small">${esc(r.obs)}</div>` : ''}
      ${pr != null && r.inicio <= hoje() ? `<div class="prog"><i style="width:${pr}%"></i></div>` : ''}</div>
      ${editRemId === r.id ? `<form class="form-rem-edit pilha" data-rid="${esc(r.id)}" style="margin-top:10px">
        <label>Horários (ex.: 08:00, 20:00)<input name="horarios" maxlength="60" inputmode="numeric" value="${esc((r.horarios || []).join(', '))}"></label>
        <label>Duração em dias (vazio = contínuo)<input name="dias" type="number" min="1" max="3650" inputmode="numeric" value="${r.dias || ''}"></label>
        <div class="acoes"><button type="submit" class="pequeno">Salvar</button><button type="button" class="ghost pequeno" data-act="cancelar-rem-edit">Cancelar</button></div>
      </form>` : ''}
      <div class="acoes" style="justify-content:flex-end">
        <button type="button" class="ghost pequeno" data-act="editar-rem" data-rid="${esc(r.id)}">Editar horários</button>
        ${r.inicio <= hoje() && (!r.dias || fimRemedio(r) >= hoje()) ? `<button type="button" class="ghost pequeno" data-act="encerrar-rem" data-rid="${esc(r.id)}">Encerrar</button>` : ''}
        <button type="button" class="ghost pequeno${armado === 'rem:' + r.id ? ' perigo' : ''}" data-act="excluir-rem" data-rid="${esc(r.id)}">${armado === 'rem:' + r.id ? 'Confirmar' : 'Excluir'}</button>
      </div></div>`;
  }).join('') : `<p class="muted">Nenhum remédio registrado ainda.</p>`) + `</div>`;
  h += formRemedio();

  h += `<div class="sec"><h2>Peso</h2></div><div class="card">${grafico(p)}</div>`;
  h += `<div class="sec"><h2>Novo registro</h2></div>${formRegistro()}`;
  h += `<div class="sec"><h2>Histórico</h2></div><div class="card">` + (ev.length ? ev.map(e => `<div class="linha">
      <div style="min-width:0"><strong>${esc(TIPOS[e.tipo])}${e.valor != null ? ' · ' + kg(e.valor) + ' kg' : ''}</strong>
      <div class="muted small">${fmtData(e.data)}${e.proxima ? ' · próxima ' + fmtData(e.proxima) : ''}${e.nota ? '<br>' + esc(e.nota) : ''}</div></div>
      <button type="button" class="ghost pequeno${armado === 'ev:' + e.id ? ' perigo' : ''}" data-act="excluir-ev" data-eid="${esc(e.id)}">${armado === 'ev:' + e.id ? 'Confirmar' : 'Excluir'}</button></div>`).join('') : `<p class="muted">Nada registrado ainda.</p>`) + `</div>`;
  h += `<div class="acoes" style="justify-content:flex-end;margin-top:16px"><button type="button" class="ghost perigo pequeno" data-act="remover-gato">${armado === 'cat:' + c.id ? 'Toque de novo para remover' : 'Remover gato'}</button></div>`;
  $('#ficha').innerHTML = h;
}

function renderHist(){
  const filtros = [['todos', 'Todos'], ...TIPOS_REGISTRO];
  const linhas = [];
  state.cats.forEach(c => c.eventos.forEach(e => linhas.push({c, e})));
  linhas.sort((a, b) => b.e.data.localeCompare(a.e.data));
  const lista = histFiltro === 'todos' ? linhas : linhas.filter(x => x.e.tipo === histFiltro);
  let h = `<div class="sec"><h2>Histórico</h2><span class="muted small">${plural(linhas.length, 'registro', 'registros')}</span></div>`;
  h += `<div class="filtros">${filtros.map(([k, v]) => `<button type="button" class="filtro" aria-pressed="${histFiltro === k}" data-act="filtro" data-f="${k}">${v}</button>`).join('')}</div>`;
  h += lista.length
    ? `<div class="card">${lista.map(({c, e}) => `<div class="linha"><div style="min-width:0"><strong>${esc(TIPOS[e.tipo])} · ${esc(c.nome)}</strong><div class="muted small">${fmtData(e.data)}${e.valor != null ? ' · ' + kg(e.valor) + ' kg' : ''}${e.nota ? ' · ' + esc(e.nota) : ''}</div></div><button type="button" class="ghost pequeno" data-act="abrir" data-id="${esc(c.id)}">Abrir</button></div>`).join('')}</div>`
    : `<div class="card vazio"><p class="muted">Nenhum registro${histFiltro === 'todos' ? ' ainda' : ' deste tipo'}.</p></div>`;
  h += `<div class="sec"><h2>Cópia de segurança</h2></div><div class="card pilha">
      <p class="muted small">Os dados ficam neste aparelho. Salve uma cópia de vez em quando, para não perder nada se trocar de celular.</p>
      <div class="acoes"><button type="button" data-act="exportar">Salvar cópia</button><button type="button" class="ghost" data-act="importar">Restaurar cópia</button></div>
      ${importacao ? `<div class="aviso"><p>Restaurar esta cópia? Os dados atuais serão substituídos.</p><div class="acoes"><button type="button" class="${armado === 'restaurar' ? 'perigo' : ''}" data-act="restaurar">${armado === 'restaurar' ? 'Toque de novo para restaurar' : 'Restaurar'}</button><button type="button" class="ghost" data-act="cancelar-restaurar">Cancelar</button></div></div>` : ''}
    </div>`;
  $('#historico').innerHTML = h;
}

function render(){
  if (view === 'ficha' && !atual()) { view = 'gatos'; catId = null; }
  ['hoje', 'calendario', 'gatos', 'ficha', 'historico'].forEach(s => { $('#' + s).hidden = s !== view; });
  renderHoje(); renderCalendarioTab(); renderGatos(); if (view === 'ficha') { renderFicha(); ajustarRodas(); } renderHist();
  animar = null;
  $('#bancoRemedios').innerHTML = bancoLista().map(n => `<option value="${esc(n)}"></option>`).join('');
  document.querySelectorAll('.tab').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === (view === 'ficha' ? 'gatos' : view) ? 'page' : 'false');
  });
}

function irPara(v){
  view = v; catId = null; editando = false; resumoAberto = false; prefill = null;
  window.scrollTo({top: 0});
  render();
}
function abrirFicha(id, pre){
  catId = id; view = 'ficha'; editando = false; resumoAberto = false; prefill = pre || null;
  window.scrollTo({top: 0});
  render();
  const alvo = pre && pre.medInicio ? '#form-rem' : pre ? '#form-reg' : null;
  if (alvo) { const f = $(alvo); if (f) f.scrollIntoView({behavior: 'smooth', block: 'start'}); }
}

function copiarTexto(texto){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(() => toast('Texto copiado'), () => selecionarResumo());
  } else selecionarResumo();
}
function selecionarResumo(){
  const ta = $('#resumo-txt');
  if (ta) { ta.focus(); ta.select(); }
  toast('Selecione o texto e copie');
}
async function compartilhar(c){
  const texto = resumoTexto(c);
  if (navigator.share) {
    try { await navigator.share({title: 'Resumo de ' + c.nome, text: texto}); } catch (_) {}
    return;
  }
  copiarTexto(texto);
}
function exportar(){
  const blob = new Blob([JSON.stringify({app: 'patinhas-em-dia', versao_app: VERSAO, formato: 3, data: hoje(), dados: state}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'patinhas-em-dia-' + hoje() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Cópia salva');
}
function setProx(f, tipo){
  const d = f.elements.data.value;
  const n = INTERVALO[tipo];
  f.elements.proxima.value = n && d ? somaDias(d, n) : '';
  $('#dica-prox').textContent = n ? 'A próxima data foi sugerida. Ajuste se precisar.' : '';
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-tab],[data-act]');
  if (!el) return;
  if (el.dataset.tab) { irPara(el.dataset.tab); return; }
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'abrir': abrirFicha(id); break;
    case 'registrar': abrirFicha(id, {tipo: el.dataset.tipo, nota: el.dataset.nota}); return;
    case 'dia-nova': abrirFicha(id, {data: el.dataset.d}); return;
    case 'rem-nova': abrirFicha(id, {medInicio: el.dataset.d}); return;
    case 'voltar': irPara('gatos'); break;
    case 'editar': editando = !editando; break;
    case 'cancelar-edicao': editando = false; break;
    case 'resumo': resumoAberto = !resumoAberto; break;
    case 'copiar-resumo': copiarTexto(resumoTexto(atual())); return;
    case 'compartilhar': compartilhar(atual()); return;
    case 'remover-gato': confirmar('cat:' + catId, () => {
      state.cats = state.cats.filter(c => c.id !== catId);
      catId = null; view = 'gatos'; editando = false; resumoAberto = false; salvar('Gato removido');
    }); return;
    case 'dose': {
      const c = state.cats.find(x => x.id === id);
      const r = c && c.remedios.find(x => x.id === el.dataset.rid);
      const d = el.dataset.d || hoje();
      if (r) {
        alternarDose(r, d, el.dataset.h);
        animar = r.id + '|' + el.dataset.h + '|' + d;
        salvar(doseFeita(r, d, el.dataset.h) ? 'Dose marcada' : 'Dose desmarcada');
      }
      break;
    }
    case 'excluir-ev': { const eid = el.dataset.eid; confirmar('ev:' + eid, () => {
      const c = atual(); if (c) { c.eventos = c.eventos.filter(e => e.id !== eid); salvar('Registro removido'); }
    }); return; }
    case 'excluir-rem': { const rid = el.dataset.rid; confirmar('rem:' + rid, () => {
      const c = atual(); if (c) { c.remedios = c.remedios.filter(r => r.id !== rid); salvar('Remédio removido'); }
    }); return; }
    case 'editar-rem': editRemId = el.dataset.rid; break;
    case 'cancelar-rem-edit': editRemId = null; break;
    case 'ativar-avisos': pedirAvisos(); return;
    case 'encerrar-rem': {
      const c = atual(); const r = c && c.remedios.find(x => x.id === el.dataset.rid);
      if (r) { r.dias = Math.max(1, dias(hoje(), r.inicio) + 1); salvar('Remédio encerrado hoje'); }
      break;
    }
    case 'add-horario': {
      const hm = pad2(pickH) + ':' + pad2(pickM);
      if (!horariosForm.includes(hm)) horariosForm = [...horariosForm, hm].sort();
      atualizarChips(); return;
    }
    case 'del-horario': { horariosForm = horariosForm.filter(x => x !== el.dataset.h); atualizarChips(); return; }
    case 'sugerir': {
      const inp = $('#nome-rem'); if (inp) inp.value = el.dataset.nome;
      const box = $('#sugestoes-rem'); if (box) box.hidden = true; return;
    }
    case 'banco-del': {
      const nome = el.dataset.nome;
      state.bancoExtra = state.bancoExtra.filter(n => n !== nome);
      salvar('Nome removido do banco');
      break;
    }
    case 'cal-dia': {
      const escopo = el.dataset.cal;
      if (escopo === 'cat') calCatDia = el.dataset.d; else calDia = el.dataset.d;
      break;
    }
    case 'cal-mes': {
      const escopo = el.dataset.cal;
      const novo = somaMes(escopo === 'cat' ? calCatMes : calMes, Number(el.dataset.delta));
      if (escopo === 'cat') { calCatMes = novo; calCatDia = novo + '-01'; }
      else { calMes = novo; calDia = novo + '-01'; }
      break;
    }
    case 'cal-ontem': { const o = somaDias(hoje(), -1); calMes = o.slice(0, 7); calDia = o; calFiltro = 'todos'; view = 'calendario'; break; }
    case 'cal-hoje': calMes = hoje().slice(0, 7); calDia = hoje(); break;
    case 'cal-filtro': calFiltro = el.dataset.f; break;
    case 'cal-modo': calTudo = !calTudo; try { localStorage.setItem('patinhas-cal-tudo', calTudo ? '1' : '0'); } catch (_) {} break;
    case 'filtro': histFiltro = el.dataset.f; break;
    case 'exportar': exportar(); break;
    case 'importar': $('#arquivo').click(); return;
    case 'restaurar': confirmar('restaurar', () => {
      state = importacao; importacao = null; catId = null; view = 'hoje'; salvar('Cópia restaurada');
    }); return;
    case 'cancelar-restaurar': importacao = null; break;
    case 'ver-exemplo': state = exemplo(); view = 'hoje'; salvar('Exemplo carregado'); break;
    case 'apagar-demo': confirmar('demo', () => { state = {cats: [], bancoExtra: []}; view = 'hoje'; salvar(); }); return;
  }
  render();
});

document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target, fd = new FormData(f);
  if (f.id === 'form-gato' || f.id === 'form-editar') {
    const nome = String(fd.get('nome') || '').trim();
    if (!nome) { toast('Digite o nome do gato'); return; }
    const dados = {nome: nome.slice(0, 40), nasc: String(fd.get('nasc') || ''), cor: String(fd.get('cor') || '').trim().slice(0, 40), tom: Number(fd.get('tom')) || 0};
    const existente = f.id === 'form-editar' ? (atual() || {}) : {};
    const foto = fotoNova || existente.foto || '';
    const ic = String(fd.get('icone') || '');
    if (ic === 'foto' && !fotoValida(foto)) { toast('Escolha uma foto para o gato'); return; }
    dados.icone = ic === 'foto' ? 'foto' : (iconeValido(ic) ? ic : 'cabeca');
    dados.foto = fotoValida(foto) ? foto : '';
    fotoNova = null;
    if (f.id === 'form-gato') {
      const c = {id: uid(), eventos: [], remedios: [], ...dados};
      state.cats.push(c);
      salvar('Gato cadastrado');
      toast(c.nome + ' foi cadastrado');
      abrirFicha(c.id);
    } else {
      const c = atual(); if (!c) return;
      Object.assign(c, dados); editando = false;
      salvar('Alterações salvas');
      render();
    }
    return;
  }
  if (f.id === 'form-banco') {
    const nome = String(fd.get('nome') || '').trim().slice(0, 60);
    if (!nome) return;
    const existe = bancoLista().some(n => n.toLowerCase() === nome.toLowerCase());
    if (!existe && state.bancoExtra.length < 200) { state.bancoExtra.push(nome); salvar('Nome adicionado ao banco'); toast(nome + ' foi adicionado'); }
    else if (existe) toast('Esse nome já está no banco');
    render();
    return;
  }
  if (f.classList.contains('form-rem-edit')) {
    const c = atual(); const r = c && c.remedios.find(x => x.id === f.dataset.rid);
    if (!r) return;
    const hr = parseHorarios(fd.get('horarios'));
    if (!hr.ok) { toast('Confira os horários. Ex.: 08:00, 20:00'); return; }
    const txtDias = String(fd.get('dias') || '').trim();
    const n = parseInt(txtDias, 10);
    if (txtDias && !(n >= 1 && n <= 3650)) { toast('Duração entre 1 e 3650 dias'); return; }
    r.horarios = hr.lista;
    r.dias = txtDias ? n : 0;
    editRemId = null;
    salvar('Remédio atualizado');
    toast('Horários atualizados');
    render();
    return;
  }
  if (f.id === 'form-rem') {
    const c = atual(); if (!c) return;
    const nome = String(fd.get('nome') || '').trim().slice(0, 60);
    const inicio = String(fd.get('inicio') || '');
    if (!nome) { toast('Digite o nome do remédio'); return; }
    if (!inicio) { toast('Escolha a data de início'); return; }
    const n = parseInt(String(fd.get('dias') || ''), 10);
    if (fd.get('dias') && !(n >= 1 && n <= 3650)) { toast('Duração entre 1 e 3650 dias'); return; }
    const lista = horariosForm.length ? [...horariosForm].sort() : [pad2(pickH) + ':' + pad2(pickM)];
    c.remedios.push({id: uid(), nome, inicio, dias: n >= 1 ? n : 0, obs: String(fd.get('obs') || '').trim().slice(0, 120), horarios: lista, feitos: {}});
    horariosForm = [];
    if (!bancoLista().some(x => x.toLowerCase() === nome.toLowerCase()) && state.bancoExtra.length < 200) state.bancoExtra.push(nome);
    prefill = null;
    salvar('Remédio adicionado');
    toast('Remédio adicionado');
    render();
    return;
  }
  if (f.id === 'form-reg') {
    const c = atual(); if (!c) return;
    const tipo = String(fd.get('tipo'));
    const data = String(fd.get('data') || '');
    if (!data) return;
    let valor = null;
    if (tipo === 'peso') {
      const v = parseFloat(String(fd.get('valor') || '').replace(',', '.'));
      if (!(v > 0 && v < 40)) { toast('Confira o peso. Ex.: 4,5'); return; }
      valor = Math.round(v * 100) / 100;
    }
    c.eventos.push({id: uid(), tipo, data, valor, proxima: String(fd.get('proxima') || ''), nota: String(fd.get('nota') || '').trim().slice(0, 300)});
    prefill = null;
    salvar('Registro salvo');
    toast('Registro salvo');
    render();
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (!t.closest || !t.closest('#form-reg')) return;
  const f = $('#form-reg');
  if (t.name === 'tipo') {
    $('#campo-peso').hidden = t.value !== 'peso';
    if (f.dataset.auto === '1') setProx(f, t.value);
  }
  if (t.name === 'data' && f.dataset.auto === '1') setProx(f, f.elements.tipo.value);
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.name === 'proxima' && t.closest && t.closest('#form-reg')) {
    $('#form-reg').dataset.auto = '0';
    $('#dica-prox').textContent = '';
  }
});
document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.name !== 'foto_arquivo' || !t.form) return;
  const arquivo = t.files && t.files[0];
  if (!arquivo) return;
  try {
    const dataUrl = await lerFoto(arquivo);
    fotoNova = dataUrl;
    const op = t.form.querySelector('.icone-op input[value="foto"]');
    if (op) {
      op.checked = true;
      const bola = op.parentElement.querySelector('.icone-bola');
      if (bola) bola.innerHTML = `<img src="${dataUrl}" alt="">`;
    }
    const rotulo = t.parentElement.querySelector('span');
    if (rotulo) rotulo.textContent = 'Trocar foto';
  } catch (e) {
    t.value = '';
    toast('Não consegui ler essa foto. Tente outra.');
  }
});
$('#arquivo').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    const dados = obj && obj.dados ? obj.dados : obj;
    if (!dados || !Array.isArray(dados.cats)) { toast('Esse arquivo não é uma cópia do app'); return; }
    importacao = norm(dados);
    armado = null;
    view = 'historico';
    render();
  } catch (_) { toast('Não consegui ler esse arquivo'); }
});

// Sugestões do banco de remédios
const semAcento = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function mostrarSugestoes(termo){
  const box = $('#sugestoes-rem');
  if (!box) return;
  const t = semAcento(String(termo || '').trim());
  const itens = bancoLista().filter(n => !t || semAcento(n).includes(t)).slice(0, 12);
  box.innerHTML = itens.map(n => `<button type="button" class="sugestao" data-act="sugerir" data-nome="${esc(n)}" onmousedown="event.preventDefault()">${esc(n)}</button>`).join('');
  box.hidden = !itens.length;
}
document.addEventListener('focusin', (ev) => { if (ev.target.id === 'nome-rem') mostrarSugestoes(ev.target.value); });
document.addEventListener('focusout', (ev) => { if (ev.target.id === 'nome-rem') setTimeout(() => { const b = $('#sugestoes-rem'); if (b) b.hidden = true; }, 200); });
document.addEventListener('input', (ev) => { if (ev.target.id === 'nome-rem') mostrarSugestoes(ev.target.value); });

// Relógio de horários: tocar num número rola até ele; rolar escolhe a hora
document.addEventListener('click', (ev) => {
  const it = ev.target.closest && ev.target.closest('.rd-item');
  if (it && it.parentElement) it.parentElement.scrollTo({top: Number(it.dataset.v) * ITEM_RODA, behavior: 'smooth'});
});
document.addEventListener('scroll', (ev) => {
  const t = ev.target;
  if (!t || !t.classList || !t.classList.contains('rd-rolo')) return;
  const max = t.dataset.rd === 'h' ? 23 : 59;
  const idx = Math.max(0, Math.min(max, Math.round(t.scrollTop / ITEM_RODA)));
  if (t.dataset.rd === 'h') pickH = idx; else pickM = idx;
  estiloRoda(t, idx);
  const disp = $('#rd-display');
  if (disp) disp.textContent = pad2(pickH) + ':' + pad2(pickM);
}, true);

// Avisos de dose (enquanto o app estiver aberto)
async function pedirAvisos(){
  if (typeof Notification === 'undefined') { toast('Este navegador não tem avisos'); return; }
  const resp = await Notification.requestPermission();
  toast(resp === 'granted' ? 'Avisos ativados' : 'Avisos não permitidos');
  render();
}
function avisar(titulo, corpo, tag){
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(reg => reg.showNotification(titulo, {body: corpo, tag, icon: 'icon-192.png'})).catch(() => {});
  } else {
    try { new Notification(titulo, {body: corpo, tag}); } catch (_) {}
  }
}
function verificarDoses(){
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const t = hoje(), ag = agoraHM();
  todosRemedios().forEach(({c, r}) => {
    if (!remedioNoDia(r, t)) return;
    (r.horarios || []).forEach(hr => {
      const chave = t + '|' + r.id + '|' + hr;
      if (hr === ag && !doseFeita(r, t, hr) && !avisados.has(chave)) {
        avisados.add(chave);
        avisar('Hora de medicar: ' + hr, r.nome + ' · ' + c.nome, chave);
      }
    });
  });
}

// Instalação
$('#logo').innerHTML = ICONE_PATA;
// Aviso de atualização: confere a versão publicada e mostra o botão Atualizar
function maisNova(a, b){
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++){
    const d = (x[i] || 0) - (y[i] || 0);
    if (d) return d > 0;
  }
  return false;
}
let versaoNova = null;
async function verificarAtualizacao(){
  if (versaoNova) return;
  try {
    const res = await fetch('./index.html', {cache: 'no-store'});
    if (!res.ok) return;
    const m = (await res.text()).match(/const VERSAO = '([\d.]+)'/);
    if (m && maisNova(m[1], VERSAO)) {
      versaoNova = m[1];
      $('#atualizar-texto').textContent = 'Atualização ' + versaoNova + ' disponível';
      $('#atualizar').hidden = false;
    }
  } catch (_) {}
}
$('#atualizar-btn').addEventListener('click', async () => {
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
  } catch (_) {}
  location.replace('./?versao=' + encodeURIComponent(versaoNova || VERSAO));
});
$('#atualizar-fechar').addEventListener('click', () => { $('#atualizar').hidden = true; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificarAtualizacao(); });
setInterval(verificarAtualizacao, 30 * 60 * 1000);
verificarAtualizacao();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); promptInstalar = e; $('#instalar').hidden = false; });
window.addEventListener('appinstalled', () => { $('#instalar').hidden = true; promptInstalar = null; toast('App instalado'); });
$('#instalar').addEventListener('click', async () => {
  if (!promptInstalar) return;
  promptInstalar.prompt();
  try { await promptInstalar.userChoice; } catch (_) {}
  promptInstalar = null;
  $('#instalar').hidden = true;
});
const emCasa = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !emCasa) $('#dica-ios').hidden = false;

state = carregar();
render();
setInterval(() => { if (view === 'hoje') renderHoje(); verificarDoses(); }, 30000);
setStatus(state.cats.length ? 'Salvo neste aparelho' : '');
</script>
