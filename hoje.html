<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1726" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="hub-icon-180.png">
<title>Hoje · Meus apps</title>
<style>
:root{--bg:#F4F1F8;--surface:#FFFFFF;--ink:#241C35;--muted:#6C6283;--line:#E2DBEE;--accent:#7A5FBE;--accent-soft:#EEE8FA;--bad:#C0392B;--warn:#B7800F;--shadow:0 1px 2px rgba(36,28,53,.05),0 8px 22px rgba(36,28,53,.08);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1726;--surface:#252036;--ink:#F1ECFA;--muted:#A79CC2;--line:#3A3152;--accent:#B39BEA;--accent-soft:#33284C;--bad:#FF8A7A;--warn:#F2C35B;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.voltar{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;font-size:15px;padding:6px 0}
header{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
header img{width:52px;height:52px;border-radius:14px;box-shadow:var(--shadow);flex:none}
h1{font-size:26px;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.grupo{margin-top:24px}
.grupo-topo{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.grupo-topo img{width:28px;height:28px;border-radius:8px;flex:none}
.grupo-topo h2{font-size:16px;margin:0;flex:1;min-width:0}
.contagem{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;text-decoration:none;color:inherit;box-shadow:var(--shadow);border-left-width:4px}
.item.bad{border-left-color:var(--bad)}
.item.warn{border-left-color:var(--warn)}
.item:active{transform:scale(.99)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item strong{font-size:15px;overflow-wrap:anywhere}
.item small{color:var(--muted);font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.item .seta{color:var(--accent);font-size:22px;flex:none}
.vazio{margin-top:48px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 18px;box-shadow:var(--shadow)}
.vazio[hidden]{display:none}
.vazio .ok{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px;font-size:26px;font-weight:700}
.vazio strong{font-size:18px}
.vazio p{color:var(--muted);margin:6px 0 0;font-size:14px}
.rodape{color:var(--muted);font-size:12.5px;text-align:center;margin-top:28px;line-height:1.5}
</style>
</head>
<body>
<main>
  <a class="voltar" href="index.html">‹ Meus apps</a>
  <header>
    <img src="hub-icon-192.png" alt="">
    <div>
      <h1>Hoje</h1>
      <div class="sub" id="resumo">Procurando pendências…</div>
    </div>
  </header>

  <div id="secoes"></div>

  <div class="vazio" id="vazio" hidden>
    <div class="ok" aria-hidden="true">✓</div>
    <strong>Tudo em dia</strong>
    <p>Nada pendente nos seus apps agora.</p>
  </div>

  <p class="rodape">Toque em um item para abrir o app direto no lugar certo.<br>Os dados são lidos deste aparelho.</p>
</main>
<script>
(function () {
  'use strict';

  // Leitura segura: cada app guarda os próprios dados no mesmo navegador deste endereço.
  function ler(chave) {
    try { return JSON.parse(localStorage.getItem(chave)); } catch (e) { return null; }
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hojeISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // Dias entre hoje e a data AAAA-MM-DD (negativo = já passou).
  function diasAte(data) {
    const [y, m, d] = data.split('-').map(Number);
    const [yh, mh, dh] = hojeISO().split('-').map(Number);
    return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(yh, mh - 1, dh)) / 86400000);
  }
  function somaDias(data, n) {
    const [y, m, d] = data.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }
  function dataBR(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  const TIPOS = { vacina: 'Vacina', vermifugo: 'Vermífugo', consulta: 'Consulta', peso: 'Peso', sintoma: 'Observação' };

  // ---------- Patinhas: lembretes (até 14 dias ou atrasados) e tratamentos que terminam em 7 dias ----------
  function itensPatinhas() {
    const s = ler('patinhas-em-dia-v1');
    if (!s || !Array.isArray(s.cats)) return [];
    const itens = [];
    s.cats.forEach(function (c) {
      const link = 'patinhas.html#gato=' + encodeURIComponent(c.id);
      (c.eventos || []).forEach(function (e) {
        if (!e || !e.proxima) return;
        const d = diasAte(e.proxima);
        if (d > 14) return;
        const quando = d < 0 ? (d === -1 ? 'venceu ontem' : 'venceu há ' + plural(-d, 'dia', 'dias'))
          : d === 0 ? 'vence hoje' : 'vence em ' + plural(d, 'dia', 'dias');
        itens.push({ ordem: d, titulo: (TIPOS[e.tipo] || 'Lembrete') + ' · ' + c.nome,
          detalhe: quando + ' (' + dataBR(e.proxima) + ')', alerta: d < 0 ? 'bad' : d <= 3 ? 'warn' : '', href: link });
      });
      (c.remedios || []).forEach(function (r) {
        if (!r || !r.dias || !r.inicio) return;
        const d = diasAte(somaDias(r.inicio, r.dias - 1));
        if (d < 0 || d > 7) return;
        itens.push({ ordem: d + 0.5, titulo: 'Tratamento · ' + r.nome + ' (' + c.nome + ')',
          detalhe: d === 0 ? 'termina hoje' : 'termina em ' + plural(d, 'dia', 'dias'), alerta: 'warn', href: link });
      });
    });
    return itens.sort(function (a, b) { return a.ordem - b.ordem; });
  }

  // ---------- Maison: produtos com estoque abaixo do mínimo (mesmo cálculo do app) ----------
  function itensMaison() {
    const d = ler('mdl.dados');
    if (!d || !Array.isArray(d.produtos)) return [];
    const saldo = {};
    d.produtos.forEach(function (p) { if (p && p.ativo !== false) saldo[p.id] = Number(p.estoqueInicial) || 0; });
    (d.compras || []).forEach(function (c) { if (c && saldo[c.produtoId] !== undefined) saldo[c.produtoId] += Number(c.quantidade) || 0; });
    (d.ajustes || []).forEach(function (a) { if (a && saldo[a.produtoId] !== undefined) saldo[a.produtoId] += Number(a.quantidade) || 0; });
    (d.vendas || []).forEach(function (v) { if (v && saldo[v.produtoId] !== undefined) saldo[v.produtoId] -= Number(v.quantidade) || 0; });
    return d.produtos
      .filter(function (p) { return p && p.ativo !== false && (Number(p.estoqueMinimo) || 0) > 0 && saldo[p.id] <= Number(p.estoqueMinimo); })
      .map(function (p) {
        const s = saldo[p.id], min = Number(p.estoqueMinimo);
        return { ordem: s, titulo: p.nome,
          detalhe: (s <= 0 ? 'sem estoque' : plural(s, 'unidade em estoque', 'unidades em estoque')) + ' · mínimo ' + min,
          alerta: s <= 0 ? 'bad' : 'warn', href: 'maison.html#estoque' };
      })
      .sort(function (a, b) { return a.ordem - b.ordem; });
  }

  // ---------- Listas: itens ainda não comprados, uma linha por lista ----------
  function itensListas() {
    const s = ler('lista-mercado.v2');
    if (!s || !Array.isArray(s.listas)) return [];
    return s.listas.map(function (l) {
      const pend = (l.itens || []).filter(function (i) { return i && !i.feito; });
      if (!pend.length) return null;
      const nomes = pend.slice(0, 3).map(function (i) { return i.texto; }).join(', ') +
        (pend.length > 3 ? ' e mais ' + (pend.length - 3) : '');
      return { ordem: -pend.length, titulo: l.nome || 'Lista',
        detalhe: plural(pend.length, 'item para comprar', 'itens para comprar') + ' · ' + nomes,
        alerta: '', href: 'listas.html#lista=' + encodeURIComponent(l.id) };
    }).filter(Boolean).sort(function (a, b) { return a.ordem - b.ordem; });
  }

  function seguro(fn) { try { return fn(); } catch (e) { return []; } }

  const grupos = [
    { nome: 'Patinhas em Dia', icone: 'icon-192.png', itens: seguro(itensPatinhas) },
    { nome: 'Maison de Lavande', icone: 'maison-icon-192.png', itens: seguro(itensMaison) },
    { nome: 'Listas', icone: 'listas-icon-192.png', itens: seguro(itensListas) }
  ];
  const total = grupos.reduce(function (n, g) { return n + g.itens.length; }, 0);

  document.getElementById('resumo').textContent = total
    ? plural(total, 'pendência', 'pendências') + ' nos seus apps'
    : 'Nada pendente agora';
  document.getElementById('secoes').innerHTML = grupos.filter(function (g) { return g.itens.length; }).map(function (g) {
    return '<section class="grupo"><div class="grupo-topo"><img src="' + g.icone + '" alt=""><h2>' + esc(g.nome) +
      '</h2><span class="contagem">' + g.itens.length + '</span></div>' +
      g.itens.map(function (i) {
        return '<a class="item ' + i.alerta + '" href="' + esc(i.href) + '"><span class="tx"><strong>' + esc(i.titulo) +
          '</strong><small>' + esc(i.detalhe) + '</small></span><span class="seta" aria-hidden="true">›</span></a>';
      }).join('') + '</section>';
  }).join('');
  document.getElementById('vazio').hidden = total > 0;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
